<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NexaBot Login</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      margin: 0; font-family: Arial, sans-serif;
      background: #101827; color: white;
      display: grid; place-items: center; min-height: 100vh;
    }
    .box {
      width:  min(320px, 85vw); padding: 25px;
      background: #1e293b; border-radius: 16px;
    }
    input, button {
      box-sizing: border-box; width: 100%;
      padding: 12px; margin-top: 12px; border-radius: 8px;
    }
    input { border: 1px solid #475569; background: #0f172a; color: white; }
    button { border: 0; background: #38bdf8; cursor: pointer; font-weight: bold; }
    p { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <div class="box">
    <h2>NexaBot</h2>
    <h3>Login / Sign Up</h3>

    <input id="email" type="email" placeholder="Email address" required>
    <input id="password" type="password" placeholder="Password (6+ characters)" required>

    <button onclick="signup()">Create Account</button>
    <button onclick="login()">Login</button>
    <button onclick="logout()">Logout</button>
    <p id="message"></p>
  </div>

  <script>
    const SUPABASE_URL = "PASTE_YOUR_SUPABASE_PROJECT_URL";clnpmxxwkecjfqazrwnx
    const SUPABASE_KEY = "PASTE_YOUR_SUPABASE_PUBLISHABLE_KEY";sb_publishable_Z6SzbWWK2MeeksEN97kUIg_hnCtR8tb

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const msg = document.getElementById("message");

    function credentials() {
      return {
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value
      };
    }

    async function signup() {
      const { email, password } = credentials();
      if (!email || password.length < 6) {
        msg.textContent = "Email bharo aur password kam se kam 6 characters ka rakho.";
        return;
      }
      const { data, error } = await db.auth.signUp({ email, password });
      msg.textContent = error ? error.message :
        data.session ? "Account created! You are logged in." :
        "Account created! Email verification check karo.";
    }

    async function login() {
      const { email, password } = credentials();
      const { error } = await db.auth.signInWithPassword({ email, password });
      msg.textContent = error ? error.message : "Login successful!";
    }

    async function logout() {
      const { error } = await db.auth.signOut();
      msg.textContent = error ? error.message : "Logged out.";
    }
  </script>
</body>
</html>
